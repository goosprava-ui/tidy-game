name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK with Capacitor
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir app && cd app
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html ../manifest.webmanifest ../sw.js ../icon-*.png www/
          npx cap init "정리의 맛" com.tidygame.app --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../tidy-game.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 최신 테스트용 APK
          body: 안드로이드 폰에서 tidy-game.apk를 받아 설치하세요. (출처를 알 수 없는 앱 설치를 한 번 허용해야 합니다)
          files: tidy-game.apk
          make_latest: true
          overwrite_files: true
